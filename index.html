<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dirt Rider MX</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  #help { position: fixed; right: 12px; top: 12px; color: #fff; background: rgba(0,0,0,.45); padding: 8px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5; }
  .pad { position: fixed; bottom: 16px; display: none; gap: 12px; }
  .pad.l { left: 16px; } .pad.r { right: 16px; }
  .pad button { width: 78px; height: 78px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(0,0,0,.4); color: #fff; font-size: 14px; font-weight: bold; }
  .pad button.on { background: rgba(255,106,26,.85); }
  @media (pointer: coarse) { .pad { display: flex; } #help { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help"><b>Controls</b><br>↑ / W &nbsp;throttle<br>↓ / S &nbsp;brake<br>← / A &nbsp;lean back<br>→ / D &nbsp;lean forward<br>R restart &nbsp; M mute</div>
<div class="pad l"><button data-btn="brake">BRAKE</button><button data-btn="gas">GAS</button></div>
<div class="pad r"><button data-btn="back">LEAN<br>BACK</button><button data-btn="fwd">LEAN<br>FWD</button></div>
<script src="physics.js"></script>
<script src="game.js"></script>
</body>
</html>
